    Projects:
      - name: Single-Cell Tumor Heterogeneity and Microenvironment Landscape of Hepatocellular Carcinoma
        start_date: 2025-05
        end_date: 2025-06
        summary: Course project.
        highlights:
          - Led a three-person team reproducing and extending a published HCC heterogeneity study; integrated 51 samples across three public scRNA-seq cohorts, recovering the reported metabolic, proliferative, and EMT malignant subtypes under independent quality control.
          - Ran trajectory and transcription-factor analyses to reconstruct subtype evolution, stratified patients by subtype composition, and annotated the T/NK, fibroblast, and endothelial compartments.

      - name: Spatial Domain Analysis of Pulmonary Fibrosis with Graph Neural Networks
        start_date: 2025-04
        end_date: 2025-06
        summary: Course project.
        highlights:
          - Built spatial graphs from 10x Xenium data and trained a GraphSAGE model to learn transcript-neighborhood embeddings; clustered the embeddings to recover spatial niches and validated them against cell-type composition.

