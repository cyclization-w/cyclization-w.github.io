      - company: Newman Lab, Stanford University
        position: "Visiting Research Student (Advisor: Aaron M. Newman)"
        location: Stanford, CA
        start_date: 2026-06
        end_date: present
        highlights:
          - Contributed to the development and evaluation of a de-novo analysis method for spatial transcriptomic data.
          - "Designed metrics and an evaluation pipeline for fair comparison of model performance: ability to recover biology in spatial data, plus scalability analysis of runtime, memory, and scaling."
          - Benchmarked against a baseline and 3 other published methods across 3 scenarios spanning large-scale data and self-designed synthetic data.
          - Selected and curated the datasets used to demonstrate the method's biological interpretation and cross-model validation.

      - company: Zemin Zhang Lab, Peking University
        position: "Undergraduate Researcher (Advisors: Zemin Zhang, Dongfang Wang)"
        location: Beijing, China
        start_date: 2025-07
        end_date: present
        summary: Cross-tissue single-cell and spatial transcriptomics of cancer and metabolic disease.
        highlights:
          - "<strong>Cross-Tissue Single-Cell and Spatial Analysis of Sex and Hormone Effects in MASH (12/2025 – Present):</strong> integrated and annotated ~2.5M single cells across 21 tissues in a 2×2×2 design crossing MASH, sex, and hormone status, building a cross-tissue reference toward a 5M single-cell mouse atlas; resolved myeloid, B cell, and neutrophil populations to subtype level; designed a unified compositional and pseudobulk differential-expression framework applied across all 21 tissues; led the spatial analysis across 65 Xenium sections and 8 tissues."
          - "<strong>Xenium 5k Spatial Atlas of the Hepatocellular Carcinoma Microenvironment (07/2025 – 11/2025):</strong> constructed a spatial atlas of 650,931 cells across 57 Xenium sections from an HCC cohort on combination targeted–immunotherapy; annotated 20 cell types from a ResolVI model; performed compositional and cell-abundance analysis within anatomical regions; correlated cell-type fractions and spatial patterns with clinical outcomes via Cox regression to identify candidate biomarkers."

      - company: Pertura / PerturaBench
        position: Independent Research (Sole Author)
        location: Beijing, China
        start_date: 2026-04
        end_date: present
        highlights:
          - Built an execution-grounded authority layer for LLM agents in Perturb-seq analysis, gating every scientific claim on verified execution, analysis scope, and upstream dependencies rather than on the agent's own account of what it did.
          - "Designed PerturaBench: 20 dependency-aware tasks over three Perturb-seq datasets and a donor-aware supplement, scoring 120 turns across three agent conditions and two prespecified repeats."
          - Prespecified the primary analysis and froze evaluators and thresholds before unblinding; reported clustered bootstrap confidence intervals and a sensitivity cohort, including the contrast that did not reproduce.
          - Reached 83.3% primary scientific fidelity vs. 44.4% and 38.9% for baselines, and 82.5% claim-authority success with no loss of informativeness.

